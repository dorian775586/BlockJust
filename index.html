<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>BLOCK JUST</title>
    <meta name="description" content="Автономная игра-головоломка BLOCK JUST для Telegram Mini App на Canvas HTML5" />
    <meta property="og:title" content="BLOCK JUST" />
    <meta property="og:description" content="Автономная игра-головоломка BLOCK JUST для Telegram Mini App на Canvas HTML5" />
    <meta property="og:type" content="website" />
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #090d16;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        touch-action: none;
      }

      #game-container {
        position: relative;
        width: 100%;
        height: 100%;
        max-width: 480px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        background: radial-gradient(circle at 50% 30%, #151d30 0%, #090d16 85%);
        padding: 12px 14px;
        box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
      }

      /* Header */
      header {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 4px 6px;
        gap: 8px;
        z-index: 10;
      }

      .logo-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .logo-title {
        font-size: 19px;
        font-weight: 800;
        letter-spacing: 0.5px;
        background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .logo-badge {
        font-size: 9px;
        font-weight: 700;
        background: rgba(56, 189, 248, 0.15);
        color: #38bdf8;
        border: 1px solid rgba(56, 189, 248, 0.3);
        border-radius: 6px;
        padding: 2px 5px;
        letter-spacing: 0.5px;
      }

      .scores-bar {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .score-box {
        background: rgba(26, 34, 53, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(8px);
        border-radius: 12px;
        padding: 4px 10px;
        min-width: 68px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: transform 0.15s ease, border-color 0.2s ease;
      }

      .score-box.bump {
        transform: scale(1.12);
        border-color: #38bdf8;
      }

      .score-label {
        font-size: 9px;
        font-weight: 700;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 0.6px;
      }

      .score-value {
        font-size: 16px;
        font-weight: 800;
        color: #f8fafc;
        line-height: 1.15;
      }

      .score-value.best {
        color: #fbbf24;
      }

      .btn-icon {
        background: rgba(26, 34, 53, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        width: 34px;
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: #cbd5e1;
        font-size: 15px;
        outline: none;
        transition: all 0.15s ease;
      }

      .btn-icon:hover {
        background: rgba(38, 48, 74, 0.9);
        color: #f8fafc;
        border-color: rgba(255, 255, 255, 0.2);
      }

      .btn-icon:active {
        transform: scale(0.92);
      }

      /* Combo Banner */
      #combo-banner {
        position: absolute;
        top: 60px;
        left: 50%;
        transform: translateX(-50%) scale(0.8);
        opacity: 0;
        pointer-events: none;
        z-index: 25;
        background: linear-gradient(90deg, rgba(236, 72, 153, 0.9), rgba(249, 115, 22, 0.9));
        padding: 5px 16px;
        border-radius: 20px;
        font-weight: 900;
        font-size: 13px;
        letter-spacing: 1px;
        color: #ffffff;
        box-shadow: 0 4px 15px rgba(249, 115, 22, 0.4);
        transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      #combo-banner.show {
        opacity: 1;
        transform: translateX(-50%) scale(1);
      }

      /* Canvas Wrapper */
      #canvas-wrapper {
        flex: 1;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        margin: 6px 0;
      }

      canvas#gameCanvas {
        display: block;
        width: 100%;
        height: 100%;
        max-width: 440px;
        cursor: grab;
        touch-action: none;
      }

      canvas#gameCanvas:active {
        cursor: grabbing;
      }

      /* Modal Overlay */
      .modal-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(6, 10, 20, 0.85);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 100;
        animation: fadeIn 0.25s ease forwards;
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      .modal-card {
        width: 100%;
        max-width: 320px;
        background: linear-gradient(160deg, #182238 0%, #0f172a 100%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(56, 189, 248, 0.15);
        border-radius: 24px;
        padding: 28px 24px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }

      @keyframes popUp {
        from { transform: scale(0.85); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }

      .modal-icon {
        font-size: 42px;
        margin-bottom: 8px;
        line-height: 1;
      }

      .modal-title {
        font-size: 24px;
        font-weight: 900;
        color: #f8fafc;
        margin-bottom: 6px;
        letter-spacing: 0.5px;
      }

      .modal-subtitle {
        font-size: 13px;
        color: #94a3b8;
        margin-bottom: 20px;
      }

      .modal-stats {
        width: 100%;
        background: rgba(10, 16, 30, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 16px;
        padding: 16px;
        margin-bottom: 22px;
        display: flex;
        justify-content: space-around;
        align-items: center;
      }

      .stat-item {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .stat-label {
        font-size: 11px;
        font-weight: 600;
        color: #64748b;
        text-transform: uppercase;
        margin-bottom: 4px;
      }

      .stat-num {
        font-size: 26px;
        font-weight: 900;
        color: #f8fafc;
      }

      .stat-num.highlight {
        color: #38bdf8;
      }

      .new-record-tag {
        display: inline-block;
        background: rgba(251, 191, 36, 0.15);
        border: 1px solid rgba(251, 191, 36, 0.4);
        color: #fbbf24;
        font-size: 10px;
        font-weight: 800;
        padding: 2px 8px;
        border-radius: 20px;
        margin-top: 4px;
        letter-spacing: 0.5px;
      }

      .btn-primary {
        width: 100%;
        background: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%);
        color: #ffffff;
        border: none;
        border-radius: 16px;
        padding: 14px 20px;
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 0.5px;
        cursor: pointer;
        outline: none;
        box-shadow: 0 6px 20px rgba(14, 165, 233, 0.4);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(14, 165, 233, 0.5);
      }

      .btn-primary:active {
        transform: translateY(1px) scale(0.98);
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <!-- Top Header -->
      <header>
        <div class="logo-group">
          <div class="logo-title">
            <span>💥</span>
            <span>BLOCK JUST</span>
          </div>
        </div>

        <div class="scores-bar">
          <div class="score-box" id="score-box">
            <span class="score-label">СЧЁТ</span>
            <span class="score-value" id="current-score">0</span>
          </div>
          <div class="score-box">
            <span class="score-label">ЛУЧШИЙ</span>
            <span class="score-value best" id="best-score">0</span>
          </div>
          <button class="btn-icon" id="sound-btn" title="Звук">🔊</button>
          <button class="btn-icon" id="restart-btn" title="Начать заново">🔄</button>
        </div>
      </header>

      <!-- Combo Indicator -->
      <div id="combo-banner">COMBO x2! 🔥</div>

      <!-- Main Game Canvas -->
      <div id="canvas-wrapper">
        <canvas id="gameCanvas"></canvas>
      </div>

      <!-- Game Over Modal -->
      <div class="modal-overlay" id="game-over-modal">
        <div class="modal-card">
          <div class="modal-icon">🏆</div>
          <h2 class="modal-title">ИГРА ОКОНЧЕНА</h2>
          <p class="modal-subtitle">Нет места для следующих фигур</p>

          <div class="modal-stats">
            <div class="stat-item">
              <span class="stat-label">Результат</span>
              <span class="stat-num highlight" id="modal-final-score">0</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">Рекорд</span>
              <span class="stat-num" id="modal-best-score">0</span>
              <div id="modal-new-record" class="new-record-tag" style="display: none;">НОВЫЙ РЕКОРД!</div>
            </div>
          </div>

          <button class="btn-primary" id="modal-restart-btn">Играть снова</button>
        </div>
      </div>
    </div>

    <!-- Self-Contained Complete Game Script -->
    <script>
      (function () {
        'use strict';

        // ==========================================
        // 1. TELEGRAM WEB APP SDK INITIALIZATION
        // ==========================================
        const tg = window.Telegram?.WebApp;
        if (tg) {
          try {
            tg.ready();
            tg.expand();
            if (tg.setHeaderColor) tg.setHeaderColor('#090d16');
            if (tg.setBackgroundColor) tg.setBackgroundColor('#090d16');
          } catch (e) {
            console.warn('Telegram SDK initialization note:', e);
          }
        }

        function triggerHaptic(type, style) {
          if (!tg?.HapticFeedback) return;
          try {
            if (type === 'impact') {
              tg.HapticFeedback.impactOccurred(style || 'medium');
            } else if (type === 'notification') {
              tg.HapticFeedback.notificationOccurred(style || 'success');
            }
          } catch (e) {}
        }

        // ==========================================
        // 2. AUDIO SYNTHESIZER (WEB AUDIO API)
        // ==========================================
        let audioCtx = null;
        let isMuted = localStorage.getItem('block_blast_muted') === 'true';

        function initAudio() {
          if (!audioCtx) {
            const AudioClass = window.AudioContext || window.webkitAudioContext;
            if (AudioClass) {
              audioCtx = new AudioClass();
            }
          }
          if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
        }

        function playSound(type, extra = 1) {
          if (isMuted || !audioCtx) return;
          try {
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'pickup') {
              osc.type = 'sine';
              osc.frequency.setValueAtTime(320, t);
              osc.frequency.exponentialRampToValueAtTime(500, t + 0.08);
              gain.gain.setValueAtTime(0.12, t);
              gain.gain.exponentialRampToValueAtTime(0.01, t + 0.08);
              osc.start(t);
              osc.stop(t + 0.08);
            } else if (type === 'place') {
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(220, t);
              osc.frequency.exponentialRampToValueAtTime(100, t + 0.09);
              gain.gain.setValueAtTime(0.2, t);
              gain.gain.exponentialRampToValueAtTime(0.01, t + 0.09);
              osc.start(t);
              osc.stop(t + 0.09);
            } else if (type === 'clear') {
              const baseFreqs = [523.25, 659.25, 783.99, 1046.5, 1318.51];
              const pitch = baseFreqs[Math.min(extra, baseFreqs.length - 1)];
              osc.type = 'sine';
              osc.frequency.setValueAtTime(pitch, t);
              osc.frequency.exponentialRampToValueAtTime(pitch * 1.5, t + 0.22);
              gain.gain.setValueAtTime(0.25, t);
              gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
              osc.start(t);
              osc.stop(t + 0.25);
            } else if (type === 'combo') {
              const chord = [523.25, 659.25, 783.99, 1046.5];
              chord.forEach((freq, idx) => {
                const subOsc = audioCtx.createOscillator();
                const subGain = audioCtx.createGain();
                subOsc.connect(subGain);
                subGain.connect(audioCtx.destination);
                subOsc.type = 'sine';
                subOsc.frequency.setValueAtTime(freq * (1 + (extra - 1) * 0.1), t + idx * 0.04);
                subGain.gain.setValueAtTime(0.15, t + idx * 0.04);
                subGain.gain.exponentialRampToValueAtTime(0.001, t + idx * 0.04 + 0.2);
                subOsc.start(t + idx * 0.04);
                subOsc.stop(t + idx * 0.04 + 0.2);
              });
            } else if (type === 'gameover') {
              osc.type = 'sawtooth';
              osc.frequency.setValueAtTime(260, t);
              osc.frequency.exponentialRampToValueAtTime(70, t + 0.5);
              gain.gain.setValueAtTime(0.2, t);
              gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
              osc.start(t);
              osc.stop(t + 0.5);
            }
          } catch (e) {}
        }

        // ==========================================
        // 3. COLOR PALETTES & SHAPES DEFINITION
        // ==========================================
        const COLOR_PALETTES = [
          { main: '#06b6d4', light: '#67e8f9', dark: '#0891b2', glow: 'rgba(6, 182, 212, 0.6)' },   // Cyan
          { main: '#3b82f6', light: '#93c5fd', dark: '#1d4ed8', glow: 'rgba(59, 130, 246, 0.6)' },   // Blue
          { main: '#8b5cf6', light: '#c4b5fd', dark: '#6d28d9', glow: 'rgba(139, 92, 246, 0.6)' },   // Purple
          { main: '#ec4899', light: '#f472b6', dark: '#be185d', glow: 'rgba(236, 72, 153, 0.6)' },   // Pink
          { main: '#f97316', light: '#fdba74', dark: '#c2410c', glow: 'rgba(249, 115, 22, 0.6)' },   // Orange
          { main: '#eab308', light: '#fde047', dark: '#a16207', glow: 'rgba(234, 179, 8, 0.6)' },    // Yellow
          { main: '#10b981', light: '#6ee7b7', dark: '#047857', glow: 'rgba(16, 185, 129, 0.6)' },   // Emerald
          { main: '#f43f5e', light: '#fda4af', dark: '#be123c', glow: 'rgba(244, 63, 94, 0.6)' }     // Rose
        ];

        // 8x8 Block Blast Shape Catalog
        const SHAPE_DEFS = [
          // 1x1
          { matrix: [[0, 0]] },
          // 2x1 & 1x2
          { matrix: [[0, 0], [0, 1]] },
          { matrix: [[0, 0], [1, 0]] },
          // 3x1 & 1x3
          { matrix: [[0, 0], [0, 1], [0, 2]] },
          { matrix: [[0, 0], [1, 0], [2, 0]] },
          // 4x1 & 1x4
          { matrix: [[0, 0], [0, 1], [0, 2], [0, 3]] },
          { matrix: [[0, 0], [1, 0], [2, 0], [3, 0]] },
          // 5x1 & 1x5
          { matrix: [[0, 0], [0, 1], [0, 2], [0, 3], [0, 4]] },
          { matrix: [[0, 0], [1, 0], [2, 0], [3, 0], [4, 0]] },
          // 2x2 Square
          { matrix: [[0, 0], [0, 1], [1, 0], [1, 1]] },
          // 3x3 Square
          { matrix: [
            [0, 0], [0, 1], [0, 2],
            [1, 0], [1, 1], [1, 2],
            [2, 0], [2, 1], [2, 2]
          ] },
          // 2x2 Small Corners (3 blocks)
          { matrix: [[0, 0], [0, 1], [1, 0]] },
          { matrix: [[0, 0], [0, 1], [1, 1]] },
          { matrix: [[0, 0], [1, 0], [1, 1]] },
          { matrix: [[0, 1], [1, 0], [1, 1]] },
          // 3x3 Large Corners (5 blocks)
          { matrix: [[0, 0], [1, 0], [2, 0], [2, 1], [2, 2]] },
          { matrix: [[0, 2], [1, 2], [2, 2], [2, 0], [2, 1]] },
          { matrix: [[0, 0], [0, 1], [0, 2], [1, 0], [2, 0]] },
          { matrix: [[0, 0], [0, 1], [0, 2], [1, 2], [2, 2]] },
          // T-shapes
          { matrix: [[0, 0], [0, 1], [0, 2], [1, 1]] },
          { matrix: [[1, 0], [1, 1], [1, 2], [0, 1]] },
          { matrix: [[0, 0], [1, 0], [2, 0], [1, 1]] },
          { matrix: [[0, 1], [1, 1], [2, 1], [1, 0]] },
          // Z and S shapes
          { matrix: [[0, 0], [0, 1], [1, 1], [1, 2]] },
          { matrix: [[0, 1], [0, 2], [1, 0], [1, 1]] },
          { matrix: [[0, 1], [1, 0], [1, 1], [2, 0]] },
          { matrix: [[0, 0], [1, 0], [1, 1], [2, 1]] },
          // 2x3 and 3x2 Rectangles
          { matrix: [[0, 0], [0, 1], [1, 0], [1, 1], [2, 0], [2, 1]] },
          { matrix: [[0, 0], [0, 1], [0, 2], [1, 0], [1, 1], [1, 2]] }
        ];

        function getRandomShape() {
          const def = SHAPE_DEFS[Math.floor(Math.random() * SHAPE_DEFS.length)];
          const palette = COLOR_PALETTES[Math.floor(Math.random() * COLOR_PALETTES.length)];
          
          let maxR = 0;
          let maxC = 0;
          def.matrix.forEach(([r, c]) => {
            if (r > maxR) maxR = r;
            if (c > maxC) maxC = c;
          });

          return {
            matrix: def.matrix,
            palette: palette,
            rows: maxR + 1,
            cols: maxC + 1,
            spawnScale: 0.2, // for pop-in animation
            spawnAlpha: 0.2
          };
        }

        // ==========================================
        // 4. GAME STATE
        // ==========================================
        const GRID_SIZE = 8;
        let grid = []; // 8x8: null or { palette }
        let dock = [null, null, null]; // 3 shapes
        let score = 0;
        let bestScore = parseInt(localStorage.getItem('block_blast_best') || '0', 10);
        let comboCount = 0;
        let isGameOver = false;

        // Visual effects lists
        let particles = [];
        let scorePopups = [];
        let clearFlashes = []; // { r, c, alpha, palette }
        let screenShake = { x: 0, y: 0, duration: 0 };

        // Interaction state
        let draggedPiece = null; // { shape, index, originX, originY, currentX, currentY, pointerId }
        let hoverPlacement = null; // { row, col, valid }

        // DOM Elements
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const currentScoreEl = document.getElementById('current-score');
        const bestScoreEl = document.getElementById('best-score');
        const scoreBoxEl = document.getElementById('score-box');
        const soundBtn = document.getElementById('sound-btn');
        const restartBtn = document.getElementById('restart-btn');
        const comboBanner = document.getElementById('combo-banner');
        const gameOverModal = document.getElementById('game-over-modal');
        const modalFinalScoreEl = document.getElementById('modal-final-score');
        const modalBestScoreEl = document.getElementById('modal-best-score');
        const modalNewRecordEl = document.getElementById('modal-new-record');
        const modalRestartBtn = document.getElementById('modal-restart-btn');

        // Layout metrics (computed on resize)
        let boardX = 0;
        let boardY = 0;
        let boardSize = 0;
        let cellSize = 0;
        let cellGap = 4;
        let dockY = 0;
        let dockHeight = 0;
        let dockSlots = []; // [{x, y, width, height}]
        let dpr = 1;

        // Initialize UI
        bestScoreEl.textContent = bestScore;
        soundBtn.textContent = isMuted ? '🔇' : '🔊';

        soundBtn.addEventListener('click', () => {
          initAudio();
          isMuted = !isMuted;
          localStorage.setItem('block_blast_muted', isMuted);
          soundBtn.textContent = isMuted ? '🔇' : '🔊';
        });

        restartBtn.addEventListener('click', () => {
          initAudio();
          startNewGame();
        });

        modalRestartBtn.addEventListener('click', () => {
          initAudio();
          gameOverModal.style.display = 'none';
          startNewGame();
        });

        function startNewGame() {
          grid = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(null));
          dock = [getRandomShape(), getRandomShape(), getRandomShape()];
          score = 0;
          comboCount = 0;
          isGameOver = false;
          particles = [];
          scorePopups = [];
          clearFlashes = [];
          draggedPiece = null;
          hoverPlacement = null;
          updateScore(0);
          gameOverModal.style.display = 'none';
          hideCombo();
        }

        function updateScore(addPoints) {
          if (addPoints > 0) {
            score += addPoints;
            scoreBoxEl.classList.remove('bump');
            void scoreBoxEl.offsetWidth; // trigger reflow
            scoreBoxEl.classList.add('bump');
          }
          currentScoreEl.textContent = score;

          if (score > bestScore) {
            bestScore = score;
            localStorage.setItem('block_blast_best', bestScore);
            bestScoreEl.textContent = bestScore;
          }
        }

        let comboTimeout = null;
        function triggerComboDisplay(count) {
          comboBanner.textContent = `COMBO x${count}! 🔥`;
          comboBanner.classList.add('show');
          if (comboTimeout) clearTimeout(comboTimeout);
          comboTimeout = setTimeout(() => {
            comboBanner.classList.remove('show');
          }, 1500);
        }

        function hideCombo() {
          if (comboTimeout) clearTimeout(comboTimeout);
          comboBanner.classList.remove('show');
        }

        // ==========================================
        // 5. RESPONSIVE RESIZE & RETINA RESOLUTION
        // ==========================================
        function resizeCanvas() {
          const wrapper = document.getElementById('canvas-wrapper');
          if (!wrapper) return;

          const rect = wrapper.getBoundingClientRect();
          dpr = window.devicePixelRatio || 1;

          canvas.width = rect.width * dpr;
          canvas.height = rect.height * dpr;
          canvas.style.width = `${rect.width}px`;
          canvas.style.height = `${rect.height}px`;

          ctx.resetTransform?.() || ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.scale(dpr, dpr);

          const W = rect.width;
          const H = rect.height;

          // Allocate layout:
          // Board is square, placed centrally in the top portion
          // Dock area is below the board
          const minSide = Math.min(W, H);
          const maxBoardW = Math.min(W - 20, H * 0.62);
          boardSize = Math.floor(maxBoardW);
          cellGap = Math.max(3, Math.floor(boardSize / 95));
          cellSize = Math.floor((boardSize - cellGap * (GRID_SIZE + 1)) / GRID_SIZE);
          boardSize = cellSize * GRID_SIZE + cellGap * (GRID_SIZE + 1);

          boardX = Math.floor((W - boardSize) / 2);
          boardY = Math.floor(Math.max(8, (H - boardSize - (H * 0.28)) / 2));

          // Dock calculation
          dockY = boardY + boardSize + 16;
          dockHeight = H - dockY - 10;
          const slotWidth = Math.floor((W - 24) / 3);

          dockSlots = [
            { x: 12 + slotWidth * 0, y: dockY, width: slotWidth, height: dockHeight },
            { x: 12 + slotWidth * 1, y: dockY, width: slotWidth, height: dockHeight },
            { x: 12 + slotWidth * 2, y: dockY, width: slotWidth, height: dockHeight }
          ];
        }

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 150));

        // ==========================================
        // 6. GAME LOGIC & COLLISION CHECKS
        // ==========================================
        function canPlace(shape, targetR, targetC) {
          if (!shape || targetR < 0 || targetC < 0) return false;
          for (let i = 0; i < shape.matrix.length; i++) {
            const [dr, dc] = shape.matrix[i];
            const r = targetR + dr;
            const c = targetC + dc;
            if (r < 0 || r >= GRID_SIZE || c < 0 || c >= GRID_SIZE) {
              return false;
            }
            if (grid[r][c] !== null) {
              return false;
            }
          }
          return true;
        }

        function canShapeFitAnywhere(shape) {
          if (!shape) return false;
          for (let r = 0; r <= GRID_SIZE - shape.rows; r++) {
            for (let c = 0; c <= GRID_SIZE - shape.cols; c++) {
              if (canPlace(shape, r, c)) {
                return true;
              }
            }
          }
          return false;
        }

        function checkAnyMovePossible() {
          // If any of the available pieces in dock can fit anywhere on board -> true
          for (let s = 0; s < dock.length; s++) {
            const shape = dock[s];
            if (shape && canShapeFitAnywhere(shape)) {
              return true;
            }
          }
          return false;
        }

        function placePiece(shape, targetR, targetC) {
          // 1. Place blocks on grid
          shape.matrix.forEach(([dr, dc]) => {
            grid[targetR + dr][targetC + dc] = {
              palette: shape.palette,
              scale: 1,
              placedAt: performance.now()
            };
          });

          playSound('place');
          triggerHaptic('impact', 'medium');

          // Add base points: 1 point per block
          let earnedScore = shape.matrix.length;

          // 2. Check completed rows and columns simultaneously
          const fullRows = [];
          const fullCols = [];

          for (let r = 0; r < GRID_SIZE; r++) {
            let rowFull = true;
            for (let c = 0; c < GRID_SIZE; c++) {
              if (grid[r][c] === null) {
                rowFull = false;
                break;
              }
            }
            if (rowFull) fullRows.push(r);
          }

          for (let c = 0; c < GRID_SIZE; c++) {
            let colFull = true;
            for (let r = 0; r < GRID_SIZE; r++) {
              if (grid[r][c] === null) {
                colFull = false;
                break;
              }
            }
            if (colFull) fullCols.push(c);
          }

          const totalLinesCleared = fullRows.length + fullCols.length;

          if (totalLinesCleared > 0) {
            comboCount++;
            triggerHaptic('notification', 'success');

            // Unique cells being cleared
            const clearedCells = new Set();
            fullRows.forEach(r => {
              for (let c = 0; c < GRID_SIZE; c++) clearedCells.add(`${r},${c}`);
            });
            fullCols.forEach(c => {
              for (let r = 0; r < GRID_SIZE; r++) clearedCells.add(`${r},${c}`);
            });

            // Flash effect & spawn particles
            clearedCells.forEach(cellKey => {
              const [r, c] = cellKey.split(',').map(Number);
              const cellObj = grid[r][c];
              const pal = cellObj ? cellObj.palette : shape.palette;

              // Clear flash
              clearFlashes.push({
                r, c,
                alpha: 1.0,
                palette: pal
              });

              // Particles
              const cx = boardX + cellGap + c * (cellSize + cellGap) + cellSize / 2;
              const cy = boardY + cellGap + r * (cellSize + cellGap) + cellSize / 2;
              spawnParticles(cx, cy, pal);

              // Empty grid cell
              grid[r][c] = null;
            });

            // Multiplier & score calculation
            const baseLineScore = clearedCells.size * 10;
            const lineBonus = totalLinesCleared > 1 ? (totalLinesCleared * 20) : 0;
            const comboMultiplier = Math.min(comboCount, 8);
            const totalEarned = (baseLineScore + lineBonus) * (1 + (comboMultiplier - 1) * 0.5);

            earnedScore += Math.round(totalEarned);

            // Screen shake
            screenShake.duration = 10 + totalLinesCleared * 5;
            screenShake.intensity = 3 + totalLinesCleared * 2;

            // Audio & popups
            playSound('clear', comboCount);
            if (comboCount > 1) {
              triggerComboDisplay(comboCount);
              playSound('combo', comboCount);
            }

            // Score popup
            const centerCX = boardX + boardSize / 2;
            const centerCY = boardY + boardSize / 2;
            scorePopups.push({
              text: `+${Math.round(totalEarned)}${comboCount > 1 ? ` (x${comboCount})` : ''}`,
              x: centerCX,
              y: centerCY,
              alpha: 1.0,
              scale: 1.4,
              color: shape.palette.light
            });
          } else {
            // Reset combo on turn without line clear
            comboCount = 0;
            hideCombo();
          }

          updateScore(earnedScore);

          // 3. Check if dock is completely used
          const allUsed = dock.every(item => item === null);
          if (allUsed) {
            dock = [getRandomShape(), getRandomShape(), getRandomShape()];
          }

          // 4. Check Game Over
          if (!checkAnyMovePossible()) {
            triggerGameOver();
          }
        }

        function triggerGameOver() {
          isGameOver = true;
          playSound('gameover');
          triggerHaptic('notification', 'error');

          modalFinalScoreEl.textContent = score;
          modalBestScoreEl.textContent = bestScore;

          if (score >= bestScore && score > 0) {
            modalNewRecordEl.style.display = 'inline-block';
          } else {
            modalNewRecordEl.style.display = 'none';
          }

          setTimeout(() => {
            gameOverModal.style.display = 'flex';
          }, 600);
        }

        // ==========================================
        // 7. PARTICLES & VISUAL EFFECTS
        // ==========================================
        function spawnParticles(x, y, palette) {
          const count = 10;
          for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 2 + Math.random() * 5;
            particles.push({
              x: x,
              y: y,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              size: 4 + Math.random() * 6,
              alpha: 1.0,
              decay: 0.02 + Math.random() * 0.03,
              color: palette.main,
              lightColor: palette.light,
              spin: Math.random() * 0.2 - 0.1,
              angle: Math.random() * Math.PI
            });
          }
        }

        // ==========================================
        // 8. TOUCH & MOUSE INTERACTION (DRAG & DROP)
        // ==========================================
        function getCanvasPoint(evt) {
          const rect = canvas.getBoundingClientRect();
          const clientX = evt.clientX || (evt.touches && evt.touches[0] ? evt.touches[0].clientX : 0);
          const clientY = evt.clientY || (evt.touches && evt.touches[0] ? evt.touches[0].clientY : 0);
          return {
            x: clientX - rect.left,
            y: clientY - rect.top
          };
        }

        function handlePointerDown(e) {
          if (isGameOver) return;
          initAudio();

          const pt = getCanvasPoint(e);

          // Check if clicked inside any occupied dock slot
          for (let i = 0; i < dockSlots.length; i++) {
            const shape = dock[i];
            if (!shape) continue;

            const slot = dockSlots[i];
            if (
              pt.x >= slot.x &&
              pt.x <= slot.x + slot.width &&
              pt.y >= slot.y &&
              pt.y <= slot.y + slot.height
            ) {
              e.preventDefault();
              playSound('pickup');
              triggerHaptic('impact', 'light');

              draggedPiece = {
                shape: shape,
                index: i,
                startX: pt.x,
                startY: pt.y,
                currentX: pt.x,
                currentY: pt.y,
                pointerId: e.pointerId !== undefined ? e.pointerId : null
              };

              try {
                if (e.pointerId !== undefined && canvas.setPointerCapture) {
                  canvas.setPointerCapture(e.pointerId);
                }
              } catch (err) {}

              updateDragPlacement(pt.x, pt.y);
              break;
            }
          }
        }

        function updateDragPlacement(px, py) {
          if (!draggedPiece) {
            hoverPlacement = null;
            return;
          }

          const shape = draggedPiece.shape;
          // Upward vertical offset for touch ergonomics (finger doesn't block view)
          const dragOffsetY = cellSize * 1.5;
          const targetY = py - dragOffsetY;
          const targetX = px;

          // Center of the shape
          const shapeW = shape.cols * (cellSize + cellGap);
          const shapeH = shape.rows * (cellSize + cellGap);

          const shapeTopLeftX = targetX - shapeW / 2;
          const shapeTopLeftY = targetY - shapeH / 2;

          // Convert to grid cell coordinates
          const col = Math.round((shapeTopLeftX - boardX - cellGap) / (cellSize + cellGap));
          const row = Math.round((shapeTopLeftY - boardY - cellGap) / (cellSize + cellGap));

          if (canPlace(shape, row, col)) {
            hoverPlacement = { row, col, valid: true };
          } else {
            hoverPlacement = null;
          }
        }

        function handlePointerMove(e) {
          if (!draggedPiece) return;
          if (draggedPiece.pointerId !== null && e.pointerId !== undefined && e.pointerId !== draggedPiece.pointerId) {
            return;
          }
          e.preventDefault();
          const pt = getCanvasPoint(e);
          draggedPiece.currentX = pt.x;
          draggedPiece.currentY = pt.y;

          updateDragPlacement(pt.x, pt.y);
        }

        function handlePointerUp(e) {
          if (!draggedPiece) return;
          if (draggedPiece.pointerId !== null && e.pointerId !== undefined && e.pointerId !== draggedPiece.pointerId) {
            return;
          }
          e.preventDefault();

          try {
            if (e.pointerId !== undefined && canvas.hasPointerCapture && canvas.hasPointerCapture(e.pointerId)) {
              canvas.releasePointerCapture(e.pointerId);
            }
          } catch (err) {}

          if (hoverPlacement && hoverPlacement.valid) {
            // Place block
            const shape = draggedPiece.shape;
            const slotIndex = draggedPiece.index;
            dock[slotIndex] = null;
            placePiece(shape, hoverPlacement.row, hoverPlacement.col);
          } else {
            // Snap back
            triggerHaptic('impact', 'light');
          }

          draggedPiece = null;
          hoverPlacement = null;
        }

        // Pointer event listeners
        canvas.addEventListener('pointerdown', handlePointerDown);
        window.addEventListener('pointermove', handlePointerMove, { passive: false });
        window.addEventListener('pointerup', handlePointerUp, { passive: false });
        window.addEventListener('pointercancel', handlePointerUp, { passive: false });

        // Touch event fallbacks to prevent scroll & pull-to-refresh
        canvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
        canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

        // ==========================================
        // 9. RENDERING (HIGH POLISH CANVAS 60FPS)
        // ==========================================
        function drawRoundedRect(context, x, y, width, height, radius) {
          context.beginPath();
          context.roundRect ? context.roundRect(x, y, width, height, radius) : (function () {
            context.moveTo(x + radius, y);
            context.lineTo(x + width - radius, y);
            context.quadraticCurveTo(x + width, y, x + width, y + radius);
            context.lineTo(x + width, y + height - radius);
            context.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            context.lineTo(x + radius, y + height);
            context.quadraticCurveTo(x, y + height, x, y + height - radius);
            context.lineTo(x, y + radius);
            context.quadraticCurveTo(x, y, x + radius, y);
          })();
          context.closePath();
        }

        // Draws a single stylish 3D beveled block
        function drawBlock(context, x, y, size, palette, alpha = 1.0, isPreview = false) {
          context.save();
          context.globalAlpha = alpha;

          const rad = Math.max(4, Math.floor(size * 0.22));

          if (isPreview) {
            // Glowing translucent preview
            drawRoundedRect(context, x, y, size, size, rad);
            context.fillStyle = palette.glow;
            context.fill();

            context.lineWidth = 2;
            context.strokeStyle = palette.light;
            context.stroke();
            context.restore();
            return;
          }

          // Block Base / Main fill
          drawRoundedRect(context, x, y, size, size, rad);
          const grad = context.createLinearGradient(x, y, x, y + size);
          grad.addColorStop(0, palette.light);
          grad.addColorStop(0.3, palette.main);
          grad.addColorStop(1, palette.dark);
          context.fillStyle = grad;
          context.fill();

          // Outer crisp subtle border
          context.lineWidth = 1;
          context.strokeStyle = 'rgba(255, 255, 255, 0.25)';
          context.stroke();

          // Top inner gloss highlight
          const glossPadding = size * 0.15;
          const glossH = size * 0.32;
          drawRoundedRect(context, x + glossPadding, y + glossPadding * 0.8, size - glossPadding * 2, glossH, rad * 0.6);
          const glossGrad = context.createLinearGradient(x, y, x, y + glossH);
          glossGrad.addColorStop(0, 'rgba(255, 255, 255, 0.55)');
          glossGrad.addColorStop(1, 'rgba(255, 255, 255, 0.05)');
          context.fillStyle = glossGrad;
          context.fill();

          // Bottom bevel shadow
          drawRoundedRect(context, x + 2, y + size - size * 0.16, size - 4, size * 0.12, rad * 0.5);
          context.fillStyle = 'rgba(0, 0, 0, 0.25)';
          context.fill();

          context.restore();
        }

        function render() {
          const W = canvas.width / dpr;
          const H = canvas.height / dpr;

          // Clear
          ctx.clearRect(0, 0, W, H);

          // Apply screen shake if active
          ctx.save();
          if (screenShake.duration > 0) {
            screenShake.duration--;
            const ox = (Math.random() - 0.5) * screenShake.intensity;
            const oy = (Math.random() - 0.5) * screenShake.intensity;
            ctx.translate(ox, oy);
          }

          // 1. Draw Grid Frame Background
          drawRoundedRect(ctx, boardX, boardY, boardSize, boardSize, 18);
          ctx.fillStyle = '#111726';
          ctx.fill();
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.09)';
          ctx.stroke();

          // 2. Draw Grid Empty Cells
          const rad = Math.max(3, Math.floor(cellSize * 0.2));
          for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
              const cx = boardX + cellGap + c * (cellSize + cellGap);
              const cy = boardY + cellGap + r * (cellSize + cellGap);

              drawRoundedRect(ctx, cx, cy, cellSize, cellSize, rad);
              ctx.fillStyle = '#182033';
              ctx.fill();

              ctx.lineWidth = 1;
              ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
              ctx.stroke();
            }
          }

          // 3. Draw Placement Highlight Preview (if dragging valid piece)
          if (draggedPiece && hoverPlacement && hoverPlacement.valid) {
            const shape = draggedPiece.shape;
            const tr = hoverPlacement.row;
            const tc = hoverPlacement.col;

            shape.matrix.forEach(([dr, dc]) => {
              const r = tr + dr;
              const c = tc + dc;
              const cx = boardX + cellGap + c * (cellSize + cellGap);
              const cy = boardY + cellGap + r * (cellSize + cellGap);
              drawBlock(ctx, cx, cy, cellSize, shape.palette, 0.75, true);
            });
          }

          // 4. Draw Placed Blocks on Board
          for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
              const cell = grid[r][c];
              if (cell) {
                const cx = boardX + cellGap + c * (cellSize + cellGap);
                const cy = boardY + cellGap + r * (cellSize + cellGap);
                drawBlock(ctx, cx, cy, cellSize, cell.palette, 1.0);
              }
            }
          }

          // 5. Draw Clear Flashes (Exploding lines)
          for (let i = clearFlashes.length - 1; i >= 0; i--) {
            const flash = clearFlashes[i];
            const cx = boardX + cellGap + flash.c * (cellSize + cellGap);
            const cy = boardY + cellGap + flash.r * (cellSize + cellGap);

            ctx.save();
            ctx.globalAlpha = flash.alpha;
            drawRoundedRect(ctx, cx, cy, cellSize, cellSize, rad);
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = flash.palette.light;
            ctx.shadowBlur = 15;
            ctx.fill();
            ctx.restore();

            flash.alpha -= 0.09;
            if (flash.alpha <= 0) {
              clearFlashes.splice(i, 1);
            }
          }

          // 6. Draw Bottom Dock Tray
          for (let i = 0; i < dockSlots.length; i++) {
            const slot = dockSlots[i];
            const shape = dock[i];

            // Subtle slot base frame
            drawRoundedRect(ctx, slot.x + 4, slot.y + 4, slot.width - 8, slot.height - 8, 16);
            ctx.fillStyle = 'rgba(17, 24, 39, 0.45)';
            ctx.fill();
            ctx.lineWidth = 1;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.stroke();

            // Render shape inside dock slot (if not currently dragged)
            if (shape && (!draggedPiece || draggedPiece.index !== i)) {
              // Smooth spawn animation
              if (shape.spawnScale < 1.0) {
                shape.spawnScale += 0.08;
                if (shape.spawnScale > 1.0) shape.spawnScale = 1.0;
              }

              // Fit shape comfortably in the slot preview
              const maxDim = Math.max(shape.rows, shape.cols, 2.5);
              const previewBlockSize = Math.floor(Math.min((slot.width - 24) / maxDim, (slot.height - 24) / maxDim));
              const previewGap = Math.max(2, Math.floor(previewBlockSize * 0.12));

              const shapeW = shape.cols * previewBlockSize + (shape.cols - 1) * previewGap;
              const shapeH = shape.rows * previewBlockSize + (shape.rows - 1) * previewGap;

              const startX = slot.x + (slot.width - shapeW) / 2;
              const startY = slot.y + (slot.height - shapeH) / 2;

              ctx.save();
              // Spawn scale effect from center
              const centerX = startX + shapeW / 2;
              const centerY = startY + shapeH / 2;
              ctx.translate(centerX, centerY);
              ctx.scale(shape.spawnScale, shape.spawnScale);
              ctx.translate(-centerX, -centerY);

              const fitsOnBoard = canShapeFitAnywhere(shape);
              const pieceAlpha = fitsOnBoard ? 1.0 : 0.38;

              shape.matrix.forEach(([r, c]) => {
                const bx = startX + c * (previewBlockSize + previewGap);
                const by = startY + r * (previewBlockSize + previewGap);
                drawBlock(ctx, bx, by, previewBlockSize, shape.palette, pieceAlpha);
              });

              ctx.restore();
            }
          }

          // 7. Draw Currently Dragged Shape
          if (draggedPiece) {
            const shape = draggedPiece.shape;
            const dragOffsetY = cellSize * 1.5;
            const curX = draggedPiece.currentX;
            const curY = draggedPiece.currentY - dragOffsetY;

            const shapeW = shape.cols * cellSize + (shape.cols - 1) * cellGap;
            const shapeH = shape.rows * cellSize + (shape.rows - 1) * cellGap;

            const startX = curX - shapeW / 2;
            const startY = curY - shapeH / 2;

            // Soft shadow under dragged piece
            ctx.save();
            ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
            ctx.shadowBlur = 20;
            ctx.shadowOffsetY = 12;

            shape.matrix.forEach(([r, c]) => {
              const bx = startX + c * (cellSize + cellGap);
              const by = startY + r * (cellSize + cellGap);
              drawBlock(ctx, bx, by, cellSize, shape.palette, 0.95);
            });

            ctx.restore();
          }

          // 8. Draw Particle Explosions
          for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.15; // gravity
            p.alpha -= p.decay;
            p.angle += p.spin;

            if (p.alpha <= 0) {
              particles.splice(i, 1);
              continue;
            }

            ctx.save();
            ctx.globalAlpha = p.alpha;
            ctx.translate(p.x, p.y);
            ctx.rotate(p.angle);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
            ctx.restore();
          }

          // 9. Draw Floating Score Popups
          for (let i = scorePopups.length - 1; i >= 0; i--) {
            const popup = scorePopups[i];
            popup.y -= 1.4;
            popup.alpha -= 0.02;

            if (popup.alpha <= 0) {
              scorePopups.splice(i, 1);
              continue;
            }

            ctx.save();
            ctx.globalAlpha = popup.alpha;
            ctx.font = '900 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            ctx.fillStyle = popup.color;
            ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
            ctx.shadowBlur = 8;
            ctx.textAlign = 'center';
            ctx.fillText(popup.text, popup.x, popup.y);
            ctx.restore();
          }

          ctx.restore();

          requestAnimationFrame(render);
        }

        // Start Game
        resizeCanvas();
        startNewGame();
        requestAnimationFrame(render);

      })();
    </script>
  </body>
</html>
